services:
  web:
    image: harshal001/django-polls-app:latest
    build: .
    command: sh -c "python manage.py migrate && gunicorn --bind 0.0.0.0:8000 --workers 3 mysite.wsgi:application"
    ports:
      - "8000:8000"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      DB_HOST: db
      DB_NAME: pollsdb
      DB_USER: pollsuser
      DB_PASSWORD: pollspass
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pollsdb
      POSTGRES_USER: pollsuser
      POSTGRES_PASSWORD: pollspass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pollsuser -d pollsdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
