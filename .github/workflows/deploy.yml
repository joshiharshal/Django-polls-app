name: Production-Grade CI/CD Pipeline

on:
  push:
    branches:
      - main
      - DevOps
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - DevOps
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: write
  issues: write
  id-token: write # Required for Cosign keyless signing and OIDC authentication

jobs:
  # ----------------------------------------------------
  # Stage 1: Validation (Linting, Tests, Coverage Gate)
  # ----------------------------------------------------
  validate:
    name: Lint, Test & Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4.1.7

      - name: Set up Python Environment
        uses: actions/setup-python@v5.1.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage flake8

      - name: Run Linter (Flake8)
        run: |
          # Fails the build on syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats other style/formatting issues as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Unit & Integration Tests with Coverage
        run: |
          coverage run manage.py test
          coverage report -m

      - name: Enforce Min 80% Test Coverage Gate
        run: |
          coverage report --fail-under=80

      - name: Generate Reports
        if: always()
        run: |
          coverage xml -o coverage.xml
          coverage html -d htmlcov

      - name: Upload HTML Coverage Report
        uses: actions/upload-artifact@v4.3.4
        if: always()
        with:
          name: coverage-report-html
          path: htmlcov/
          retention-days: 14

      - name: Upload XML Coverage Report
        uses: actions/upload-artifact@v4.3.4
        if: always()
        with:
          name: coverage-report-xml
          path: coverage.xml
          retention-days: 14

      - name: Create job summary
        if: always()
        run: |
          echo "### Test Execution Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Tests completed successfully" >> $GITHUB_STEP_SUMMARY
          echo "- **Coverage**: $(coverage report | tail -n 1 | awk '{print $NF}')" >> $GITHUB_STEP_SUMMARY

  # ----------------------------------------------------
  # Stage 2: Security Checks
  # ----------------------------------------------------
  security-scans:
    name: Enterprise Security Scanning
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4.1.7
        with:
          fetch-depth: 0

      # 1. GitLeaks - Secret Scan
      - name: Run GitLeaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      # 2. Trivy Filesystem Scan
      - name: Run Trivy Filesystem Vulnerability Scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: 1 # Fail pipeline if Critical/High vulnerabilities are found

      - name: Upload Trivy FS Report
        uses: actions/upload-artifact@v4.3.4
        if: always()
        with:
          name: trivy-fs-report
          path: trivy-results.sarif
          retention-days: 14

      # 3. Semgrep SAST Scan
      - name: Run Semgrep SAST Scan
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep:1.80.0 semgrep scan --config auto --sarif --output /src/semgrep.sarif || true

      - name: Upload Semgrep SAST Report
        uses: actions/upload-artifact@v4.3.4
        if: always()
        with:
          name: semgrep-report
          path: semgrep.sarif
          retention-days: 14

      # 4. CodeQL Core SAST
      - name: Initialize CodeQL Analysis
        uses: github/codeql-action/init@v3.25.15
        with:
          languages: python
          queries: security-extended,security-and-quality

      - name: Autobuild CodeQL
        uses: github/codeql-action/autobuild@v3.25.15

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3.25.15
        with:
          category: "/language:python"

      # 5. SBOM Generation
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0.17.2
        with:
          format: 'cyclonedx-json'
          output-name: 'sbom.json'

      - name: Upload SBOM Report
        uses: actions/upload-artifact@v4.3.4
        with:
          name: sbom-report
          path: sbom.json
          retention-days: 14

      # Slack Alert on failure
      - name: Notify Security Failure
        if: failure()
        continue-on-error: true
        uses: rtCamp/action-slack-notify@v2.3.2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: '#FF0000'
          SLACK_TITLE: '🚨 Security Vulnerability Gate Triggered!'
          SLACK_MESSAGE: 'Critical security issues found in codebase. Scanning reports uploaded.'

  # ----------------------------------------------------
  # Stage 3: AI Code Review (Runs on PRs)
  # ----------------------------------------------------
  ai-review:
    name: OpenCode AI Code Review
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4.1.7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5.1.0
        with:
          python-version: '3.12'

      - name: Run AI Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          ANTIGRAVITY_AI_KEY: ${{ secrets.ANTIGRAVITY_AI_KEY }}
        run: |
          python3 .github/scripts/ai_review.py

  # ----------------------------------------------------
  # Stage 4: Multi-Arch Build, Push, & Sign Image
  # ----------------------------------------------------
  build-and-push:
    name: Build, Push & Sign Docker Image
    needs: [validate, security-scans]
    if: github.event_name != 'pull_request' # Only build on push to main/DevOps/tags
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4.1.7

      - name: Set up QEMU (for multi-architecture support)
        uses: docker/setup-qemu-action@v3.0.0
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.3.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v3.2.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Tag Names
        id: get_tag
        run: |
          # Use tag name if triggered by a tag, otherwise use git SHA
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            harshal001/django-polls-app:latest
            harshal001/django-polls-app:${{ steps.get_tag.outputs.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy Container Image Scan
      - name: Run Trivy Container Image Scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: 'harshal001/django-polls-app:${{ steps.get_tag.outputs.TAG }}'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: 1
        env:
          TRIVY_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: Upload Trivy Container Report
        uses: actions/upload-artifact@v4.3.4
        if: always()
        with:
          name: trivy-image-report
          path: trivy-image-results.sarif
          retention-days: 14

      # Cosign Signatures
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign Docker Image (OIDC Keyless)
        run: |
          cosign sign --yes "harshal001/django-polls-app:${{ steps.get_tag.outputs.TAG }}"

  # ----------------------------------------------------
  # Stage 5: Deploy to Staging
  # ----------------------------------------------------
  deploy-staging:
    name: Deploy to Staging
    needs: build-and-push
    if: github.ref == 'refs/heads/DevOps' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: http://staging.polls.local
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.1.7

      - name: Set up Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Install Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: 'v3.15.2'

      - name: Helm Deploy to Staging & Auto-Rollback on Failure
        run: |
          helm upgrade --install django-polls-app ./helm/django-polls-app \
            --namespace django-polls \
            --create-namespace \
            --values ./helm/django-polls-app/values-staging.yaml \
            --set web.image.tag=${{ github.sha }} \
            --wait \
            --timeout 10m0s || {
              echo "Staging Deployment Failed! Initiating Rollback..."
              helm rollback django-polls-app --namespace django-polls
              exit 1
            }

      - name: Verify Web Deployment Health
        run: |
          kubectl rollout status deployment/django-polls-app-web --namespace django-polls --timeout=5m

      - name: Run Staging In-Cluster Smoke Tests
        run: |
          echo "Verifying Health Check..."
          kubectl run smoke-staging --rm -i --restart=Never \
            --image=curlimages/curl --namespace=django-polls -- \
            curl -v --silent --fail --max-time 10 http://django-polls-app-web:8000/health/
          
          echo "Verifying Metrics..."
          kubectl run smoke-metrics-staging --rm -i --restart=Never \
            --image=curlimages/curl --namespace=django-polls -- \
            curl -v --silent --fail --max-time 10 http://django-polls-app-web:8000/metrics/

      - name: Notify Slack Staging Success
        if: success()
        continue-on-error: true
        uses: rtCamp/action-slack-notify@v2.3.2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: '#00FF00'
          SLACK_TITLE: 'Staging Deploy Successful'
          SLACK_MESSAGE: 'Successfully deployed version ${{ github.sha }} to Staging.'

  # ----------------------------------------------------
  # Stage 6: Deploy to Production (Manual Approval via Env Guard)
  # ----------------------------------------------------
  deploy-production:
    name: Deploy to Production
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://polls.local
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.1.7

      - name: Set up Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Install Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: 'v3.15.2'

      - name: Helm Deploy to Production & Auto-Rollback on Failure
        run: |
          helm upgrade --install django-polls-app ./helm/django-polls-app \
            --namespace django-polls \
            --create-namespace \
            --values ./helm/django-polls-app/values-production.yaml \
            --set web.image.tag=${{ github.ref_name }} \
            --wait \
            --timeout 10m0s || {
              echo "Production Deployment Failed! Initiating Rollback..."
              helm rollback django-polls-app --namespace django-polls
              exit 1
            }

      - name: Verify Web Deployment Health
        run: |
          kubectl rollout status deployment/django-polls-app-web --namespace django-polls --timeout=5m

      - name: Run Production In-Cluster Smoke Tests
        run: |
          echo "Verifying Health Check..."
          kubectl run smoke-prod --rm -i --restart=Never \
            --image=curlimages/curl --namespace=django-polls -- \
            curl -v --silent --fail --max-time 10 http://django-polls-app-web:8000/health/
          
          echo "Verifying Metrics..."
          kubectl run smoke-metrics-prod --rm -i --restart=Never \
            --image=curlimages/curl --namespace=django-polls -- \
            curl -v --silent --fail --max-time 10 http://django-polls-app-web:8000/metrics/

      - name: Notify Slack Production Release Success
        if: success()
        continue-on-error: true
        uses: rtCamp/action-slack-notify@v2.3.2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: '#36a64f'
          SLACK_TITLE: '🚀 Production Release Successful'
          SLACK_MESSAGE: 'Successfully released version ${{ github.ref_name }} to Production environment!'
