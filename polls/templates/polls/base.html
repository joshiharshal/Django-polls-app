<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}QuickPolls - Modern Polls App{% endblock %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Styles -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'polls/style.css' %}">
</head>
<body>
    <header class="app-header">
        <div class="header-container">
            <a href="{% url 'polls:index' %}" class="logo">
                <i class="fa-solid fa-square-poll-vertical logo-icon"></i>
                <span class="logo-text">Quick<span class="highlight">Polls</span></span>
            </a>
            <nav class="nav-links">
                <a href="{% url 'polls:index' %}" class="nav-link"><i class="fa-solid fa-house"></i> Home</a>
                <a href="/admin/" class="nav-link admin-btn"><i class="fa-solid fa-lock"></i> Admin</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="content-container">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <footer class="app-footer">
        <div class="footer-container">
            <p>&copy; {% now "Y" %} QuickPolls. Crafted with <i class="fa-solid fa-heart heart-icon"></i> and Django.</p>
        </div>
    </footer>
</body>
</html>
